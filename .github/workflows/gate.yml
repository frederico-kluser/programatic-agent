name: huu gate
on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The suite builds REAL git repos in temp dirs and commits into them (no
      # git mocks — see the writing-tests skill). A GitHub runner ships with no
      # identity, so every helper that does not set one per-repo died on
      # `fatal: unable to auto-detect email address`, taking 64 tests with it.
      # A developer's machine has a global identity, which is why this was
      # invisible locally.
      - name: Configure git identity (the suite commits for real)
        run: |
          git config --global user.email "gate@huu.invalid"
          git config --global user.name "huu gate"
      - run: npm ci
      - run: npm run build
      # gate.sh is invoked WHOLE, never step by step: its STEPS registry is the
      # single list, so a step added there runs here automatically and the two
      # cannot drift. `bash scripts/gate.sh --list-from-ci` parses this file to
      # prove it.
      #
      # One of those steps is `check-dockerfile`, a STATIC scan for
      # BuildKit-only Dockerfile syntax. It is static on purpose: a real
      # `docker build` here would NOT catch the bug it guards, because GitHub
      # runners ship buildx and would happily build a `RUN --mount` that dies on
      # a user's factory Docker. A green build on this runner is exactly the
      # false comfort that let the regression live from the first commit.
      - run: bash scripts/gate.sh
